name: docker-release

# 构建三组多架构（amd64 + arm64）Linux 镜像并发布到 GHCR
# 设计文档：docs/impl-spec/CI/github-ci-spec.md

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: '手动构建 tag 后缀（最终 tag: dev-<run_id>-<suffix>，留空则 dev-<run_id>）'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  # ── Deps-base 镜像（Python 依赖 .venv，三镜像共用）─────────────────────────
  deps-build:
    name: deps-base (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            cache_scope: everlingo-deps-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache_scope: everlingo-deps-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/everlingo-deps
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=dev-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag_suffix == '' }}
            type=raw,value=dev-${{ github.run_id }}-${{ inputs.tag_suffix }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag_suffix != '' }}

      - name: Append arch suffix to tags
        id: arch_tags
        run: |
          {
            echo "tags<<EOF"
            echo "${{ steps.meta.outputs.tags }}" | sed "s/$/-${{ matrix.arch }}/"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push single-arch deps-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/deps-base/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.arch_tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  # ── Deps-base 多架构 manifest 合并 ──────────────────────────────────────────
  deps-manifest:
    name: merge deps-base manifest
    needs: deps-build
    runs-on: ubuntu-24.04
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (re-derive base tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/everlingo-deps
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=dev-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag_suffix == '' }}
            type=raw,value=dev-${{ github.run_id }}-${{ inputs.tag_suffix }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag_suffix != '' }}

      - name: Create multi-arch manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          echo "$TAGS" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "$tag" \
              "$tag-amd64" \
              "$tag-arm64"
            echo "✓ merged deps-base: $tag"
          done

      - name: Show final tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Published deps-base tags"
            echo "$TAGS" | while IFS= read -r tag; do echo "- \`$tag\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 应用镜像（everlingo / ws-master / ws-router）───────────────────────────
  build:
    name: build ${{ matrix.image }} (${{ matrix.arch }})
    needs: deps-build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # everlingo（workspace container，含前端 web/dist）
          - image: everlingo
            dockerfile: deploy/ws-container/Dockerfile
            arch: amd64
            runner: ubuntu-24.04
            cache_scope: everlingo-amd64
          - image: everlingo
            dockerfile: deploy/ws-container/Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
            cache_scope: everlingo-arm64
          # everlingo-ws-master（多用户编排服务，无前端）
          - image: everlingo-ws-master
            dockerfile: deploy/ws-master/Dockerfile
            arch: amd64
            runner: ubuntu-24.04
            cache_scope: everlingo-ws-master-amd64
          - image: everlingo-ws-master
            dockerfile: deploy/ws-master/Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
            cache_scope: everlingo-ws-master-arm64
          # everlingo-ws-router（多用户路由服务，无前端）
          - image: everlingo-ws-router
            dockerfile: deploy/ws-router/Dockerfile
            arch: amd64
            runner: ubuntu-24.04
            cache_scope: everlingo-ws-router-amd64
          - image: everlingo-ws-router
            dockerfile: deploy/ws-router/Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
            cache_scope: everlingo-ws-router-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=dev-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag_suffix == '' }}
            type=raw,value=dev-${{ github.run_id }}-${{ inputs.tag_suffix }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag_suffix != '' }}

      # 给每条 tag 追加 -<arch> 后缀，作为单架构镜像 tag
      - name: Append arch suffix to tags
        id: arch_tags
        run: |
          {
            echo "tags<<EOF"
            echo "${{ steps.meta.outputs.tags }}" | sed "s/$/-${{ matrix.arch }}/"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Derive version used by DEPS_IMAGE build-arg (matches metadata-action semver/dev tag)
      - name: Derive DEPS version
        id: deps_ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="dev-${{ github.run_id }}${{ inputs.tag_suffix && format('-{0}', inputs.tag_suffix) || '' }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "deps_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build & push single-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.arch_tags.outputs.tags }}
          build-args: |
            DEPS_IMAGE=ghcr.io/${{ github.repository_owner }}/everlingo-deps:${{ steps.deps_ver.outputs.deps_version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  manifest:
    name: merge ${{ matrix.image }} manifest
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [everlingo, everlingo-ws-master, everlingo-ws-router]
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 用相同 meta 规则重推 base tag（不含 arch 后缀），用于合并
      - name: Docker meta (re-derive base tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=dev-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag_suffix == '' }}
            type=raw,value=dev-${{ github.run_id }}-${{ inputs.tag_suffix }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag_suffix != '' }}

      # 对每条目标 tag（不含 arch 后缀）合并 amd64 + arm64 为统一多架构 manifest
      - name: Create multi-arch manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          echo "$TAGS" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            # tag 形如 "ghcr.io/labilezhu/everlingo:1.2.3"
            docker buildx imagetools create -t "$tag" \
              "$tag-amd64" \
              "$tag-arm64"
            echo "✓ merged: $tag"
          done

      - name: Show final tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Published multi-arch tags (${{ matrix.image }})"
            echo ""
            echo "$TAGS" | while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              echo "- \`$tag\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
