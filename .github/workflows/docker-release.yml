name: docker-release

# 构建多架构（amd64 + arm64）Linux 镜像并发布到 GHCR
# 设计文档：docs/impl-spec/CI/github-ci-spec.md

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: '手动构建 tag 后缀（最终 tag: dev-<run_id>-<suffix>，留空则 dev-<run_id>）'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=dev-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag_suffix == '' }}
            type=raw,value=dev-${{ github.run_id }}-${{ inputs.tag_suffix }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag_suffix != '' }}

      # 给每条 tag 追加 -<arch> 后缀，作为单架构镜像 tag
      - name: Append arch suffix to tags
        id: arch_tags
        run: |
          {
            echo "tags<<EOF"
            echo "${{ steps.meta.outputs.tags }}" | sed "s/$/-${{ matrix.arch }}/"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push single-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docs/impl-spec/deploy/image/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.arch_tags.outputs.tags }}
          cache-from: type=gha,scope=everlingo-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=everlingo-${{ matrix.arch }}

  manifest:
    name: merge multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 对每条目标 tag（不含 arch 后缀）合并 amd64 + arm64 为统一多架构 manifest
      - name: Create multi-arch manifests
        env:
          TAGS: ${{ needs.build.outputs.tags }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          echo "$TAGS" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            # tag 形如 "ghcr.io/owner/everlingo:1.2.3"
            docker buildx imagetools create -t "$tag" \
              "$tag-amd64" \
              "$tag-arm64"
            echo "✓ merged: $tag"
          done

      - name: Show final tags
        env:
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          echo "## Published multi-arch tags" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "- \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done
