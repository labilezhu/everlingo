# EverLingo 多用户部署编排
# 使用前准备：
#   export DOCKER_GID=$(getent group docker | cut -d: -f3)
#   export HOST_WS_DIR=$HOME/everlingo/workspaces
# 示例配置见 deploy/examples/，填入 secret 后启动：
#   docker compose up -d
#
# 文档：docs/impl-spec/multiple-users/deploy.md
services:
  ws_router:
    image: ${WS_ROUTER_IMAGE}
    labels:
      app: everlingo    
      everlingo.container: ws_router
    # ENTRYPOINT 已是 `python -m everlingo`（见 Dockerfile），command 只需补子命令 + config
    command: ["ws_router", "--config", "/etc/everlingo/ws_router.yaml"]
    environment:
      EVERLINGO_PUBLIC_BASE_URL: ${EVERLINGO_PUBLIC_BASE_URL}     
      MASTER_SECRET: ${MASTER_SECRET} 
      JWT_SECRET: ${JWT_SECRET} 
      WS_ROUTER_TRUSTED_PROXY_IP: ${WS_ROUTER_TRUSTED_PROXY_IP} 
    ports:
      - ${WS_ROUTER_LISTEN}:8100        # 仅 nginx 可达
    volumes:
      - "./deploy/examples/ws_router.yaml:/etc/everlingo/ws_router.yaml:ro"
    expose:
      - "8100"
    depends_on:
      - ws_master
    networks:
      - everlingo-net
    restart: unless-stopped

  ws_master:
    image: ${WS_MASTER_IMAGE}
    labels:
      app: everlingo  
      everlingo.container: ws_master   
    # 同上，ENTRYPOINT 为 `python -m everlingo`
    command: ["ws_master", "--config", "/etc/everlingo/ws_master.yaml"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}    
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}    
      OPENAI_MODEL: ${OPENAI_MODEL}   
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}   
      HOST_WS_DIR: ${HOST_WS_DIR}   
      EVERLINGO_PUBLIC_BASE_URL: ${EVERLINGO_PUBLIC_BASE_URL} 
      WORKSPLACE_IMAGE: ${WORKSPLACE_IMAGE}
      MASTER_SECRET: ${MASTER_SECRET} 
    volumes:
      - "./deploy/examples/ws_master.yaml:/etc/everlingo/ws_master.yaml:ro"
      - "./deploy/examples/ws_container_everlingo_template.yaml:/etc/everlingo/ws_container_everlingo_template.yaml:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "${HOST_WS_DIR}:/workspaces"
    group_add:
      - "${DOCKER_GID}"              # 宿主 docker 组 GID
    expose:
      - "8101"
    networks:
      - everlingo-net
    restart: unless-stopped

networks:
  everlingo-net:
    name: everlingo-net

volumes:
  master-data: