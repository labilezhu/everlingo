# workspace container 的 everlingo.yaml 模板
#
# 用途：WS-Master 创建新 ws-container 时，将此文件拷贝到
#       <host_workspace_dir>/everlingo.yaml 作为该 workspace 的初始配置。
#       见 ws-master.md §5.2。
#
# 设计源：docs/impl-spec/multiple-users/ws_container_everlingo_template.yaml
# 部署副本：本文件（deploy/examples/）供 compose 挂载，内容与设计源一致。
#
# 关键约定：
# - sys_setting.openai_* 留空：依赖容器 env fallback
#   （config.py:get_llm_config() 已支持 `ss.openai_* or os.getenv("OPENAI_*")`）。
#   LLM 密钥由 WS-Master 作为容器 env 注入，不落宿主磁盘。
# - user_profile.language 仅放默认值：用户首次进入后可在 UI 修改并写回此文件
#   （复用现有 save_profile 逻辑）。
# - public_address.base_url 留空：外部域名不写进 template（避免被用户在 UI 误改、
#   且部署域名变更后无法跟随更新）。改由 WS-Master 把 ws_master.yaml 的
#   public_base_url 经容器 env EVERLINGO_PUBLIC_BASE_URL 注入，
#   setting.get_web_public_base_url() 的 env fallback 据此返回外部域名。

sys_setting:
  openai_api_key: ""        # 留空，由容器 env OPENAI_API_KEY 注入
  openai_base_url: ""       # 同上
  openai_model: ""          # 同上
  openai_embedding_model: ""# 同上
  logging_setting:
    log_file: ""
    log_level: debug

user_profile:
  language:
    interface_language: zh-CN   # 默认值，用户可在 UI 修改
    target_language: en         # 默认值，用户可在 UI 修改

plugins:
  channels:
    channel_web:
      listener:
        port: 8000
        interface: 0.0.0.0
      public_address:
        base_url: ""            # 留空；由 WS-Master 注入 EVERLINGO_PUBLIC_BASE_URL env