# EverLingo 配置文件
# 存放于 $workspace/everlingo.yaml
# 优先级高于同名的环境变量

sys_setting:
  # LLM Provider API Key（必需）
  openai_api_key:
  # 兼容 OpenAI Chat Completions 的 API Base URL
  openai_base_url:
  # 使用的模型名称
  openai_model:
  # Embedding 模型名称（可选，无默认值）。空值时 create_ai_embedding() 抛错
  # 复用 openai_api_key / openai_base_url，指向 OpenRouter 上的 embedding 模型
  # （如 openai/text-embedding-3-small）
  openai_embedding_model:

  logging_setting:
    # 日志文件路径。默认: $workspace/logs/everlingo.log
    log_file:
    # 日志级别。可选: debug/info/warn/error。默认: debug
    log_level: debug

  tracing_setting:
    # 跟踪服务。可选: langfuse 。空值时不启动 tracing
    tracing_service:
    # langfuse secret key。如 sk-lf-xxxx
    langfuse_secret_key:
    # langfuse public key。如 pk-lf-ce-xxxx
    langfuse_public_key:
    # langfuse base url。如 http://192.168.16.130:3300
    langfuse_base_url:

user_profile:
  # 用户语言设置（首次运行时交互生成）
  language:
    # 界面语言（可选）。留空时运行时按 OS locale 推断、兜底 "en"。
    # 非空时必须在可用界面语言内（当前: "zh-CN", "en"）。推断值不写回 yaml。
    interface_language:
    # 目标学习语言。可选值: "zh-CN", "en", "ja", "fr", "de"
    target_language: en

# 用户自由偏好笔记 (USER.md)
# 存放于 $workspace/USER.md ，Markdown 自由文本。
# 由用户通过聊天（Agent 调用 user_doc 工具）或外部编辑器维护。
# 内容会被注入到 Agent 的 system prompt，用于个性化查词/翻译/答疑。
# 示例内容见 /USER.example.md


plugins:
  channels:
    channel_web: # Web Session Acceptor 配置
      listener: # 监听地址
        port: 8000 # 默认 8000
        interface: localhost  # 默认 localhost
      public_address: # 浏览器访问地址。如外网或 https 反向代理访问时配置
        base_url: http://localhost:8000 # 默认 用上面的 listener 的生效配置生成： http://$interface:$port

